buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Safe namespace injection for older modules under modern AGP 8/9+
// This avoids touching compileSdk entirely, preventing the lifecycle crash
subprojects { project ->
    if (project.hasProperty("android")) {
        // Only patch missing namespaces to prevent manifest merger collisions
        if (project.android.hasProperty("namespace") && project.android.namespace == null) {
            project.android.namespace = project.name.replaceAll("[^a-zA-Z0-9.]", "")
        }
    }
}